name: flowy-e2e
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d test"]
      interval: 2s
      timeout: 2s
      retries: 30
  server:
    build: ./server
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: test
      DATABASE_URL: postgres://test:test@db:5432/test
      JWT_SECRET: ephemeral-test-secret
      AI_MOCK: "true"
      AI_MOCK_SCRIPT: /shared/scenario.json
      CORS_ORIGIN: http://client:5173
    volumes:
      - e2e_shared:/shared
    command: sh -c "npm run migrate && exec node e2e/bootstrap.js"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 30
  client:
    build: ./client
    environment:
      API_PROXY_TARGET: http://server:4000
      VITE_REAL_API: auth,assistant,finance,orders,alerts
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: client
    depends_on:
      server:
        condition: service_healthy
  e2e:
    build: ./e2e
    depends_on:
      server:
        condition: service_healthy
      client:
        condition: service_started
    environment:
      DATABASE_URL: postgres://test:test@db:5432/test
    volumes:
      - e2e_shared:/shared
      - ./.e2e-artifacts:/artifacts
volumes:
  e2e_shared:
