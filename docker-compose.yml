# Local development stack: PostgreSQL + Express API + Vite dev server (hot reload on both).
#   docker compose up --build
#   client  -> http://localhost:5173
#   server  -> http://localhost:4000
#   db      -> localhost:${POSTGRES_PORT:-5432}

name: sales-assistant

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sales_assistant}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Secrets (JWT_SECRET, FB_*, SEPAY_*, AI_*) come from server/.env (copy it from .env.example).
    # The values below override it with Docker-specific settings.
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-sales_assistant}
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "4000:4000"
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules # keep the Linux node_modules from the image
    # Apply migrations, then start nodemon. -L (polling) because file events don't cross Windows bind mounts.
    command: sh -c "npm run migrate && npx nodemon -L --watch src src/app.js"

  client:
    build: ./client
    restart: unless-stopped
    depends_on:
      - server
    environment:
      API_PROXY_TARGET: http://server:4000 # Vite proxies /api and /health here
      VITE_USE_POLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173

volumes:
  pgdata:
  server_node_modules:
  client_node_modules:
